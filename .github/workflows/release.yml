name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: mymindstorm/setup-emsdk@v15

      - name: Warm up Emscripten cache (zlib port, libc++)
        run: |
          unset EM_FROZEN_CACHE
          emcc --version
          printf '#include <vector>\nint main(){std::vector<int> v(3);return v[0];}\n' > /tmp/warm.cpp
          em++ /tmp/warm.cpp -s USE_ZLIB=1 -o /tmp/warm.js

      - name: Install dependencies
        run: npm install

      - name: Build WASM package
        run: ./build.sh

      - name: Test
        run: npm test

      - name: Pack package
        id: pack
        run: |
          npm pack
          echo "file=$(ls wasm-cfitsio-*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-cfitsio-package
          path: ${{ steps.pack.outputs.file }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}
          generate_release_notes: true
