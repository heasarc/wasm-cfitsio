name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: mymindstorm/setup-emsdk@v15

      - name: Pre-build Emscripten zlib port
        run: embuilder build zlib

      - name: Install dependencies
        run: npm install

      - name: Build WASM package
        run: ./build.sh

      - name: Test
        run: npm test

      - name: Pack package
        id: pack
        run: |
          npm pack
          echo "file=$(ls wasm-cfitsio-*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-cfitsio-package
          path: ${{ steps.pack.outputs.file }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}
          generate_release_notes: true
